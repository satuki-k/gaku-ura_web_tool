<!option robots 0>
<!option template users/template.html>
<!option title {TITLE}>
<!include admin_edit.js>
<!option css_standalone 1>
<form method="POST" id="form">
	<input type="hidden" name="csrf_token" value="{CSRF_TOKEN}">
	<input type="hidden" name="name" value="{NAME}">
	<input type="hidden" name="submit_type" value="{SUBMIT_TYPE}">
	<h1><label><span id="fparea"></span><input type="text" name="new_path" value="{PATH}/" placeholder="{PATH}/"><input type="text" name="new_name" value="{NAME}" placeholder="{NAME}"></label></h1>
	<p id="ui">
		<a href="{EXIT}" id="exit">戻る</a>
		<label>mode
			<select name="perm">
				<option value="no">{PERM} (変更しない)</option>
				<option value="DIR">755 ディレクトリ</option>
				<option value="CGI">745 cgi</option>
				<option value="CGI2">755 cgi</option>
				<option value="STATIC">644 静的ファイル</option>
				<option value="STATIC2">666 静的ファイル</option>
				<option value="MPRIVATE">604 隠しファイル</option>
				<option value="PRIVATE">600 隠しファイル</option>
			</select>
		</label>
		<label><input type="checkbox" name="remove" value="yes">削除する</label>
		<label><button type="submit">O K</button></label>
	</p>
	{FORM_AFTER}
</form>
<p>{WEB_OPEN} <a href="{DOWNLOAD}" download>ダウンロードする</a></p>
<p style="display:none;" {API_ARGS}id="gaku-ura_args"></p>
