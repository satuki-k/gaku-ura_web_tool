<!option robots 0>
<!option template users/template.html>
<!include admin.js>
<!option css_standalone 1>
<h1>{TITLE}</h1>
<p><!include custom/admin_shortcut.html></p>
<table>
	<thead>
		<tr id="f">
			<th colspan="5">
				<form method="POST" enctype="multipart/form-data" id="form">
					<input type="hidden" name="csrf_token" value="{CSRF_TOKEN}">
					<label><ruby><rb>新規</rb><rt>new</rt></ruby>
						<select name="new" id="new">
							<option value="folder">フォルダ</option>
							<option value="file">ファイル</option>
							<option value="php">PHP</option>
							<option value="html">html</option>
							<option value="css">css</option>
							<option value="js">Javascript</option>
							<option value="pl">perl</option>
							<option value="py">python3</option>
							<option value="db">SQLite DB</option>
							<option value=".htaccess">.htaccess</option>
							<option value="/sitemap.xml">/sitemap.xml</option>
							<option value="/robots.txt">/robots.txt</option>
						</select>
					</label>
					<label id="new_name"><ruby><rb>名前</rb><rt>name</rt></ruby><input type="text" name="name" id="name"></label>
					<span>　</span>
					<label id="files"><ruby><rb>ﾌｧｲﾙをｱｯﾌﾟﾛｰﾄﾞ</rb><rt>upload file</rt></ruby><input type="file" name="file0" id="file"></label>
					<span> </span>
					<label id="folders"><ruby><rb>ﾌｫﾙﾀﾞをｱｯﾌﾟﾛｰﾄﾞ</rb><rt>upload folder</rt></ruby><input type="file" name="folder[]" id="folder" webkitdirectory multiple></label>
					<span> </span>
					<label><ruby><rb>グループ</rb><rt>group</rt></ruby><select name="group" id="group">{GROUP}</select></label>
					<span> </span>
					<label><button type="submit" name="submit" value="new">O K</button></label>
				</form>
			</th>
		</tr>
		<tr><td colspan="4">{SHORTCUT}</td></tr>
		<tr><td colspan="4">{PATH}</td></tr>
		<tr><th><ruby><rb>名 前</rb><rt>name</rt></ruby></th><th><ruby><rb>編 集</rb><rt>edit</rt></ruby></th><th><ruby><rb>詳 細</rb><rt>detail</rt></ruby></th><th><ruby><rb>更 新</rb><rt>time</rt></ruby></th></tr>
	</thead>
	<tbody>
		{FILE_LIST}
	</tbody>
</table>
<p>一度にアップロードできるファイル数や合計サイズは、php.iniの設定に依存します。</p>
<p>右クリックメニューの「全てダウンロード」は、選択したファイルではなく<b>現在のディレクトリ</b>をダウンロードします。</p>
<p style="display:none;" {API_ARGS}id="gaku-ura_args"></p>
